server.port=8080

# H2 file-based persistence so data survives restarts (stored under ./data/)
spring.datasource.url=jdbc:h2:file:./data/ticketdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS is configured per-controller via @CrossOrigin; allowed origins:
# http://localhost:5174 (standalone frontend repo), http://localhost:5173 (legacy), http://localhost:3000 (Next.js)
